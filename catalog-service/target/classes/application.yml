server:
  # In preview environments, the platform may inject PORT/HOST.
  port: ${PORT:8083}
  address: ${HOST:0.0.0.0}

spring:
  application:
    name: catalog-service

  datasource:
    # IMPORTANT: request these env vars from the orchestrator/user as needed
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/shopizer}
    username: ${CATALOG_DB_USER:shopizer}
    password: ${CATALOG_DB_PASSWORD:shopizer}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: shopizer

  flyway:
    enabled: true
    # Catalog service owns catalog objects in the shared "shopizer" schema for now.
    # If/when schema-per-service is enforced, update this to "catalog" (and migrations accordingly).
    default-schema: shopizer
    schemas: shopizer
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # In preview environments, Keycloak may not be running. If empty, SecurityConfig permits all.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
