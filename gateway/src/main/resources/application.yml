spring:
  application:
    name: shopizer-modern-java21-gateway

  cloud:
    gateway:
      # Route requests from the frontend (/api/**) to the appropriate backend services.
      # This file intentionally avoids rewriting catalog endpoints to the preview stubs.
      routes:
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://catalog-service}
          predicates:
            - Path=/api/v1/catalog/**
          # IMPORTANT:
          # Previously this route rewrote /api/v1/catalog/** to /__preview/catalog/**.
          # That rewrite is now removed so requests go to the real catalog-service API.

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
