server:
  port: 8081

spring:
  application:
    name: gateway

  cloud:
    gateway:
      default-filters:
        # Propagate Authorization header as-is (default), add basic tracing header example.
        - AddRequestHeader=X-Request-Source, gateway
      routes:
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/customers/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Matches the seeded Keycloak realm under infra/keycloak (see infra/keycloak/realm-export).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/shopizer}
