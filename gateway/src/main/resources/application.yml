spring:
  application:
    name: shopizer-modern-java21-gateway

server:
  port: ${PORT:3001}

spring:
  cloud:
    gateway:
      # Route requests from the frontend (/api/**) to the appropriate backend services.
      routes:
        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://catalog-service}
          predicates:
            - Path=/api/v1/catalog/**

        # Fallback: proxy any other /api/** calls to the legacy shopizer container.
        # This helps previews come up even if only the legacy monolith is present.
        - id: legacy-shopizer
          uri: ${SHOPIZER_URL:http://shopizer:8080}
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
