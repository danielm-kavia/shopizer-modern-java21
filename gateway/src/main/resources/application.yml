server:
  # In preview environments (like Kavia), the platform often injects PORT/HOST.
  # Keep 8081 as the local default to match docker-compose.
  port: ${PORT:8081}
  address: ${HOST:0.0.0.0}
  # Make redirects / Swagger UI links work correctly behind the platform reverse proxy (https -> http upstream).
  forward-headers-strategy: framework

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Matches the seeded Keycloak realm under infra/keycloak (see infra/keycloak/realm-export).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/shopizer}

  cloud:
    gateway:
      default-filters:
        # Propagate Authorization header as-is (default), add basic tracing header example.
        - AddRequestHeader=X-Request-Source, gateway
      routes:
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/customers/**

springdoc:
  api-docs:
    # Kavia preview points at /openapi.json for this service.
    path: /openapi.json

        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/catalog/**

        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/cart/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/orders/**

        - id: checkout-service
          uri: ${CHECKOUT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/checkout/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/payments/**

        - id: shipping-service
          uri: ${SHIPPING_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/shipping/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/inventory/**

        - id: pricing-service
          uri: ${PRICING_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/pricing/**

        - id: tax-service
          uri: ${TAX_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/tax/**

        - id: promotions-service
          uri: ${PROMOTIONS_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/promotions/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
