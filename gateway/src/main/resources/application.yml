server:
  # In preview environments (like Kavia), the platform injects PORT/HOST.
  # Default to docker-compose's port for local dev.
  port: ${PORT:8081}
  address: ${HOST:0.0.0.0}
  # Make redirects / Swagger UI links work correctly behind a reverse proxy (https -> http upstream).
  forward-headers-strategy: framework

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Optional: in preview, Keycloak usually isn't running. Keep empty by default so the app can boot.
          # Provide KEYCLOAK_ISSUER_URI in environments where you want JWT validation enabled.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}

  cloud:
    gateway:
      default-filters:
        - AddRequestHeader=X-Request-Source, gateway
      routes:
        - id: customer-service
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/customers/**

        - id: catalog-service
          uri: ${CATALOG_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/catalog/**

        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/carts/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/orders/**

        - id: checkout-service
          uri: ${CHECKOUT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/checkout/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/payments/**

        - id: shipping-service
          uri: ${SHIPPING_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/shipping/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/inventory/**

        - id: pricing-service
          uri: ${PRICING_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/pricing/**

        - id: tax-service
          uri: ${TAX_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/tax/**

        - id: promotions-service
          uri: ${PROMOTIONS_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/promotions/**

springdoc:
  api-docs:
    # Kavia preview expects the OpenAPI document at /openapi.json
    path: /openapi.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
