services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: shopizer-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      # Local dev only. Do not reuse in production.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export:/opt/keycloak/data/import
    restart: unless-stopped
